## ====================================================================
# Application bindings (Pure Bash & Standalone Tools)
# ====================================================================

# Core Apps
bind = SUPER, RETURN, exec, kitty
bindd = SUPER ALT, RETURN, Tmux, exec, kitty bash -c "tmux attach || tmux new -s Work"
bind = SUPER, E, exec, kitty -e sudo -E yazi
bind = SUPER, M, exec, kitty -e ncmpcpp
bind = SUPER, Q, killactive
bind = SUPER, W, exec, steam
bind = SUPER CTRL, RETURN, exec, wofi --show drun
bind = SUPER, SPACE, exec, kitty -e btop
bind = SUPER, V, exec, kitty -e bash -c 'nvim'

# Browser & TUI Replacements (Replacing Omarchy launch wrappers)
bind = SUPER, B, exec, brave
bindd = SUPER SHIFT, D, Docker, exec, kitty -e lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, obsidian

# Web Apps (Launched as standalone app windows via Chromium/Brave)
# Note: If you use a different browser, replace 'brave --app=' with your browser's specific flag
bindd = SUPER SHIFT, A, Gemini, exec, brave --app="https://gemini.google.com"
bindd = SUPER SHIFT, C, Calendar, exec, brave --app="https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, brave --app="https://gmail.google.com"
bindd = SUPER SHIFT, Y, YouTube, exec, brave --app="https://mail.google.com/mail/u/0/#inbox" 
bindd = SUPER SHIFT, G, WhatsApp, exec, brave --app="https://web.whatsapp.com/" 
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, brave --app="https://messages.google.com/web/conversations" 
bindd = SUPER SHIFT, P, Google Photos, exec, brave --app="https://photos.google.com/" 
bindd = SUPER SHIFT, X, X, exec, brave --app="https://x.com/"
bindd = SUPER SHIFT CTRL, T, exec, brave --app="https://tiktok.com/"

# Logitech MX Keys / Hardware Actions
# 1. Screenshot: Points directly to your tracked custom script
bindd = SUPER, C, ScreenShot, exec, screenshot.sh          

# 2. Emoji Menu: Using 'wofi' natively instead of Walker/Omarchy menus
bind = SUPER, PERIOD, exec, wofi --show emoji

# 3. Audio mixer TUI
bind = SUPER SHIFT CTRL, W, exec, kitty -e wiremix

# Main Menu Override (Replaced Omarchy-Menu with Wofi application launcher)
unbind = SUPER, ALT, SPACE
bindr = SUPER, SUPER_L, exec, wofi --show drun ====================================================================
